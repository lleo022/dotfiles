# Noctalia v5 config (base layer). GUI changes go to ~/.local/state/noctalia/settings.toml,
# which overrides this file. To keep a GUI change, copy its keys from settings.toml into this file
# (or local.toml if personal), then delete settings.toml. Don't use `noctalia config export > config.toml`:
# it also merges local.toml and would put personal values into git.
# Personal values (location, greeting, avatar) live in local.toml next to this file (gitignored).

[audio]
enable_notification_sounds = false

[bar]
order = [ "1" ]

    [bar.1]
    center = [ "workspaces" ]
    contact_shadow = true
    end = [ "tray", "network", "bluetooth", "volume", "battery", "clock", "notifications", "control-center" ]
    margin_ends = 0
    padding = 20
    radius = 0
    scale = 1.15
    shadow = false
    start = [ "launcher", "group:g1", "media" ]
    thickness = 50
    widget_spacing = 10

        [[bar.1.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "sysmon", "temp", "ram" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 20

[control_center.calendar]
show_events_card = false

# Keep every field: a behavior defined here replaces the built-in one entirely (no per-field defaults).
[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.65
fingerprint = false
transition = [ "wipe" ]
transition_duration = 1000

[lockscreen_widgets]
enabled = true
widget_order = [
    "lockscreen-login-box@eDP-2",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 853.5
    cy = 885.5
    output = "eDP-2"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 480.0
    cx = 853.5
    cy = 213.5
    output = "eDP-2"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
        format = "{:%I:%M %p}"

    # Greeting text (settings.title) is set in local.toml
    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 80.0
    box_width = 448.0
    cx = 853.5
    cy = 133.5
    output = "eDP-2"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background_opacity = 0.0
        opacity = 1.0

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 80.0
    box_width = 336.0
    cx = 853.5
    cy = 277.5
    output = "eDP-2"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background_opacity = 0.0
        clock_style = "digital"
        format = "{:%B %d, %Y}"

[nightlight]
enabled = true
temperature_night = 5500

[notification]
history_retention_hours = 8

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

# avatar_path is set in local.toml
[shell]
font_family = "Noto Sans"
polkit_agent = true

    [shell.launcher]
    default_view = "pinned"
    pinned = [
        "firefox",
        "com.microsoft.VSCode",
        "discord",
        "steam",
        "spotify-launcher",
        "obsidian",
        "org.telegram.desktop",
        "slack"
    ]
    sort_by_usage = false

    [shell.mpris]
    blacklist = [ "x.com", "youtube.com" ]

    # Lock is disabled here (bound to Mod+Escape in niri) but kept for easy re-enabling.
    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    label = "Suspend"
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "4"
    variant = "destructive"

[theme]
builtin = "Tokyo-Night" # only used when source = "builtin"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "kitty", "niri" ]

# No wallpaper image here: wallpapers picked in the UI are saved to settings.toml.
# The solid-black default below is only a fallback for when settings.toml has none.
[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = [ "disc", "fade", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "color:#000000"

[weather]
unit = "imperial"

[widget.clock]
capsule = true
capsule_opacity = 0.75
capsule_padding = 10
font_scale = 1.1
format = """{:%I:%M %p
%m/%d/%Y}"""
scale = 1.1

[widget.media]
art_size = 20
capsule = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.ram]
show_value = false

[widget.sysmon]
show_value = false

[widget.temp]
show_value = false

[widget.volume]
show_label = false
